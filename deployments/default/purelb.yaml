---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  labels:
    app: purelb
    component: lbnodeagent
  name: lbnodeagent
  namespace: purelb-system
spec:
  # Pace rollouts: each new pod gets 30s to re-establish its BGP sessions
  # before the next node restarts. Readiness can't gate this; it doesn't
  # track sessions.
  minReadySeconds: 30
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  selector:
    matchLabels:
      app: purelb
      component: lbnodeagent
  template:
    metadata:
      annotations:
        prometheus.io/port: '7472'
        prometheus.io/scrape: 'true'
      labels:
        app: purelb
        component: lbnodeagent
    spec:
      containers:
      - env:
        - name: DEFAULT_ANNOUNCER
          value: "PureLB"
        - name: PURELB_NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: PURELB_HOST
          valueFrom:
            fieldRef:
              fieldPath: status.hostIP
        - name: PURELB_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: PURELB_POD_UID
          valueFrom:
            fieldRef:
              fieldPath: metadata.uid
        # Lease-based election configuration
        - name: PURELB_LEASE_DURATION
          value: "10s"
        - name: PURELB_RENEW_DEADLINE
          value: "7s"
        - name: PURELB_RETRY_PERIOD
          value: "2s"
        image: ghcr.io/purelb/purelb/lbnodeagent:VERSION_TAG
        imagePullPolicy: IfNotPresent
        name: lbnodeagent
        ports:
        - containerPort: 7472
          name: monitoring
        # Health shares the metrics port. 7472 exists in every install
        # variant, so one probe spec covers BGP and no-BGP alike; the
        # k8gobgp sidecar's 7474 is absent from a no-BGP install. No
        # "host" field, so kubelet probes the pod IP -- which under
        # hostNetwork is the node address the metrics listener binds.
        #
        # /healthz fails only when the service-sync goroutine is stuck
        # inside a single work item. /readyz reports convergence.
        startupProbe:
          # /healthz, NOT /readyz. kubelet RESTARTS the container when a
          # startup probe fails, so this must answer only "has the
          # process come up". Pointed at /readyz it restarts on any
          # readiness condition too: a node whose address guard
          # legitimately stood down never passed startup and crash-looped
          # instead of just going NotReady.
          httpGet:
            path: /healthz
            port: 7472
          periodSeconds: 10
          failureThreshold: 30
        livenessProbe:
          httpGet:
            path: /healthz
            port: 7472
          periodSeconds: 20
          timeoutSeconds: 3
        readinessProbe:
          httpGet:
            path: /readyz
            port: 7472
          periodSeconds: 10
          timeoutSeconds: 3
        resources:
          limits:
            memory: 100Mi
        securityContext:
          allowPrivilegeEscalation: false
          appArmorProfile:
            type: Unconfined
          capabilities:
            add:
            - NET_ADMIN
            - NET_RAW
            - BPF
            drop:
            - ALL
          readOnlyRootFilesystem: true
          seccompProfile:
            type: RuntimeDefault
      hostNetwork: true
      nodeSelector:
        kubernetes.io/os: linux
      serviceAccountName: lbnodeagent
      # Allow enough time for graceful shutdown:
      # - Mark unhealthy + ForceSync (~1s)
      # - Traffic drain wait (2s)
      # - Lease deletion + cleanup (~1s)
      # Plus buffer for slow API server responses
      terminationGracePeriodSeconds: 30
      tolerations:
      - effect: NoSchedule
        key: node-role.kubernetes.io/master
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: purelb
    component: allocator
  name: allocator
  namespace: purelb-system
spec:
  # The allocator is the cluster-wide owner of IP allocation, so exactly
  # one must run. Recreate rather than the default RollingUpdate: with a
  # single replica maxSurge rounds up to 1, which would briefly run two
  # allocators handing out addresses from the same pools during every
  # upgrade. A short gap in allocation is the safer trade.
  replicas: 1
  strategy:
    type: Recreate
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: purelb
      component: allocator
  template:
    metadata:
      annotations:
        prometheus.io/port: '7472'
        prometheus.io/scrape: 'true'
      labels:
        app: purelb
        component: allocator
    spec:
      containers:
      - image: ghcr.io/purelb/purelb/allocator:VERSION_TAG
        imagePullPolicy: IfNotPresent
        env:
        - name: PURELB_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: DEFAULT_ANNOUNCER
          value: "PureLB"
        name: allocator
        ports:
        - containerPort: 7472
          name: monitoring
        # Health shares the metrics port. 7472 exists in every install
        # variant, so one probe spec covers BGP and no-BGP alike; the
        # k8gobgp sidecar's 7474 is absent from a no-BGP install. No
        # "host" field, so kubelet probes the pod IP -- which under
        # hostNetwork is the node address the metrics listener binds.
        #
        # /healthz fails only when the service-sync goroutine is stuck
        # inside a single work item. /readyz reports convergence.
        startupProbe:
          # /healthz, NOT /readyz. kubelet RESTARTS the container when a
          # startup probe fails, so this must answer only "has the
          # process come up". Pointed at /readyz it restarts on any
          # readiness condition too: a node whose address guard
          # legitimately stood down never passed startup and crash-looped
          # instead of just going NotReady.
          httpGet:
            path: /healthz
            port: 7472
          periodSeconds: 10
          failureThreshold: 30
        livenessProbe:
          httpGet:
            path: /healthz
            port: 7472
          periodSeconds: 20
          timeoutSeconds: 3
        readinessProbe:
          httpGet:
            path: /readyz
            port: 7472
          periodSeconds: 10
          timeoutSeconds: 3
        resources:
          limits:
            memory: 100Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - all
          readOnlyRootFilesystem: true
          seccompProfile:
            type: RuntimeDefault
      nodeSelector:
        kubernetes.io/os: linux
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: allocator
      # Enough for the work queue to finish the item in flight and close
      # its sidecar-IPAM connections.
      #
      # 0 does not mean "no SIGTERM", as the API reference's wording
      # suggests: measured against a live kubelet, the signal is delivered
      # and a 1s shutdown handler completed, while 3s and 8s ones were
      # killed -- a window of roughly 2s. The allocator's own path is fast
      # enough for that. What is not is the work queue sitting in a
      # sidecar-IPAM Allocate, bounded at 10s: killed between that RPC and
      # the Service status write, the address leaks in the external IPAM.
      # With strategy: Recreate this path runs on every upgrade.
      #
      # A grace period is a ceiling, not a sleep: the pod goes as soon as
      # the process exits, so this costs nothing in the normal case.
      terminationGracePeriodSeconds: 10
