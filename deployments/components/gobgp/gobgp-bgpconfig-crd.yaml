apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
    config.kubernetes.io/index: '1'
    internal.config.kubernetes.io/index: '1'
  name: configs.bgp.purelb.io
spec:
  group: bgp.purelb.io
  names:
    kind: BGPConfiguration
    listKind: BGPConfigurationList
    plural: configs
    shortNames:
    - bgpconfig
    singular: config
  scope: Namespaced
  versions:
  - name: v1
    schema:
      openAPIV3Schema:
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            properties:
              definedSets:
                items:
                  properties:
                    list:
                      items:
                        type: string
                      type: array
                    name:
                      type: string
                    prefixes:
                      items:
                        description: |-
                          Prefix matches either an IP prefix or a Route Target Constrain prefix -
                          exactly one of them. gobgpd rejects a prefix with both set, so ipPrefix is
                          optional rather than required; without that, rtcPrefix could never be used.
                        properties:
                          ipPrefix:
                            type: string
                          maskLengthMax:
                            format: int32
                            type: integer
                          maskLengthMin:
                            format: int32
                            type: integer
                          rtcPrefix:
                            description: RtcPrefix is a Route Target Constrain prefix, for RTC policy matching.
                            type: string
                        type: object
                        x-kubernetes-validations:
                        - message: exactly one of ipPrefix or rtcPrefix must be set
                          rule: has(self.ipPrefix) != has(self.rtcPrefix)
                      maxItems: 1024
                      type: array
                    type:
                      type: string
                  required:
                  - name
                  - type
                  type: object
                maxItems: 256
                type: array
              dynamicNeighbors:
                items:
                  properties:
                    peerGroup:
                      type: string
                    prefix:
                      type: string
                  required:
                  - peerGroup
                  - prefix
                  type: object
                maxItems: 256
                type: array
              global:
                properties:
                  applyPolicy:
                    properties:
                      exportPolicy:
                        properties:
                          defaultAction:
                            type: string
                          name:
                            type: string
                          policies:
                            items:
                              type: string
                            type: array
                        type: object
                      importPolicy:
                        properties:
                          defaultAction:
                            type: string
                          name:
                            type: string
                          policies:
                            items:
                              type: string
                            type: array
                        type: object
                    type: object
                  asn:
                    description: ASN is the Autonomous System Number for this BGP speaker
                    format: int32
                    type: integer
                  bindToDevice:
                    type: string
                  confederation:
                    properties:
                      enabled:
                        type: boolean
                      identifier:
                        format: int32
                        type: integer
                      memberAsList:
                        items:
                          format: int32
                          type: integer
                        type: array
                    type: object
                  defaultRouteDistance:
                    description: |-
                      INERT as of gobgp-netlink v1.3.5, which removed the field from its API
                      because nothing in the daemon implemented it. Accepted here so existing
                      manifests keep applying; setting it has no effect and logs a warning event.
                    properties:
                      externalRouteDistance:
                        format: int32
                        type: integer
                      internalRouteDistance:
                        format: int32
                        type: integer
                    type: object
                  ebgpMaximumPaths:
                    description: |-
                      EbgpMaximumPaths caps how many eBGP paths the multipath set may hold for one
                      prefix. Requires useMultiplePaths.
                    format: int32
                    maximum: 255
                    type: integer
                  families:
                    description: |-
                      Families is the global address-family set. Omit it to keep gobgpd's
                      default of ipv4-unicast and ipv6-unicast.

                      The enum is enforced because the wire encoding is a bare ordinal: an
                      unrecognized name cannot be passed through, and a wrong value does not
                      error - it enables no families at all. See globalFamilyOrdinals.
                    items:
                      enum:
                      - ipv4-unicast
                      - ipv6-unicast
                      - ipv4-labeled
                      - ipv6-labeled
                      - ipv4-vpn
                      - ipv6-vpn
                      - l2vpn-vpls
                      - l2vpn-evpn
                      type: string
                    maxItems: 16
                    type: array
                  gracefulRestart:
                    properties:
                      enabled:
                        type: boolean
                      helperOnly:
                        type: boolean
                      restartTime:
                        description: |-
                          RestartTime is how long a peer should hold this speaker's routes while it
                          restarts, in seconds. Omit it to take gobgpd's default, which is the
                          session's hold time.

                          Bounded at 4095 because RFC 4724 section 3 gives Restart Time 12 bits,
                          sharing a 16-bit word with a 4-bit flags nibble. A larger value does not
                          fail - it silently overflows into the flags and corrupts the capability, so
                          this is not a Go type limit and 65535 would be the wrong bound.
                        format: int32
                        maximum: 4095
                        type: integer
                      staleRoutesTime:
                        description: |-
                          StaleRoutesTime is how long this speaker keeps a restarting peer's routes
                          marked stale before purging them, in seconds. 0 disables the timer, which is
                          gobgpd's default.

                          Only families that have not sent End-of-RIB are purged when it fires, so a
                          family that finished its refresh keeps its adj-RIB-in - checked in
                          staleRoutesExpiredFunc.
                        format: int32
                        type: integer
                    type: object
                  ibgpMaximumPaths:
                    description: |-
                      IbgpMaximumPaths caps how many iBGP paths the multipath set may hold for one
                      prefix. Requires useMultiplePaths.
                    format: int32
                    maximum: 255
                    type: integer
                  listenAddresses:
                    description: |-
                      ListenAddresses are the local addresses gobgpd accepts BGP connections on.
                      Omit it to take gobgpd's default, which is every interface ("0.0.0.0" and
                      "::").

                      The pattern rejects obvious nonsense early, with a message that names the
                      field. It is deliberately not a complete IP grammar - the authoritative
                      check is netip.ParseAddr in the controller, which is what gobgpd itself
                      uses, so a value that passes here and fails there is reported before
                      StartBgp rather than after.

                      CEL isIP() would be stricter but needs apiserver 1.31+, and a CEL rule that
                      cannot compile makes the whole CRD unapplyable rather than degrading.
                    items:
                      maxLength: 45
                      pattern: ^[0-9a-fA-F:.]+(%[0-9a-zA-Z._-]+)?$
                      type: string
                    maxItems: 16
                    type: array
                  listenPort:
                    format: int32
                    type: integer
                  nodeStatus:
                    description: NodeStatus configures per-node BGPNodeStatus reporting
                    properties:
                      enabled:
                        description: 'Enabled activates BGPNodeStatus reporting. Default: true.'
                        type: boolean
                      heartbeatSeconds:
                        description: |-
                          HeartbeatSeconds is the interval for unconditional status writes even when state is unchanged.
                          Default: 60. Minimum: 10.
                        format: int32
                        minimum: 10
                        type: integer
                    type: object
                  routeSelectionOptions:
                    properties:
                      advertiseInactiveRoutes:
                        description: |-
                          AdvertiseInactiveRoutes advertises routes not installed in the FIB.
                          INERT as of gobgp-netlink v1.3.5, which removed the field from its API
                          because nothing in the daemon implemented it. Accepted here so existing
                          manifests keep applying; setting it has no effect and logs a warning event.
                        type: boolean
                      alwaysCompareMed:
                        description: AlwaysCompareMed compares MED across paths from different ASes.
                        type: boolean
                      disableBestPathSelection:
                        description: DisableBestPathSelection turns off best-path selection entirely.
                        type: boolean
                      enableAigp:
                        description: |-
                          EnableAigp enables AIGP metric comparison.
                          INERT as of gobgp-netlink v1.3.5, which removed the field from its API
                          because nothing in the daemon implemented it. Accepted here so existing
                          manifests keep applying; setting it has no effect and logs a warning event.
                        type: boolean
                      externalCompareRouterID:
                        description: ExternalCompareRouterID compares router IDs for external paths.
                        type: boolean
                      ignoreAsPathLength:
                        description: IgnoreAsPathLength skips AS-path length in best-path selection.
                        type: boolean
                      ignoreNextHopIgpMetric:
                        description: |-
                          IgnoreNextHopIgpMetric skips the next-hop IGP metric.
                          INERT as of gobgp-netlink v1.3.5, which removed the field from its API
                          because nothing in the daemon implemented it. Accepted here so existing
                          manifests keep applying; setting it has no effect and logs a warning event.
                        type: boolean
                    type: object
                  routerID:
                    description: |-
                      RouterID is the BGP router identifier. Must be a valid IPv4 address.
                      Supports three resolution modes:
                      1. Explicit IPv4: "192.168.1.1" - used as-is
                      2. Template variable: "${NODE_IP}", "${NODE_IPV4}", "${NODE_EXTERNAL_IP}",
                         or "${node.annotations['key']}" - resolved from node
                      3. Auto-detect: when omitted, auto-detects from node's internal IPv4,
                         or generates from node name hash if no IPv4 available
                    type: string
                  routerIDPool:
                    description: |-
                      RouterIDPool is the CIDR pool for hash-based router ID generation.
                      Used when RouterID is omitted and node has no IPv4 address (IPv6-only nodes).
                      Must be at least /24 (256 addresses). Each cluster should use a unique pool.
                      Default: "10.255.0.0/16"
                    type: string
                  useMultiplePaths:
                    description: |-
                      UseMultiplePaths installs more than one path per prefix, so the multipath
                      set can be exported to the kernel as ECMP.

                      It requires at least one of ebgpMaximumPaths or ibgpMaximumPaths, and they
                      require it: gobgp-netlink v1.3.5 refuses both halves of that pair, because a
                      limit without multipath was accepted, reported back, and did nothing, while
                      multipath without a limit selects only the single best path. Both are checked
                      here before StartBgp so the error names the CRD fields.
                    type: boolean
                required:
                - asn
                type: object
              neighbors:
                items:
                  description: |-
                    Neighbor is one BGP peer.

                    The BFD/link-local rule below catches a failure with no other symptom: BFD
                    control packets to a link-local address need the scope zone to pick an
                    egress interface, and without one transmit still succeeds on some arbitrary
                    interface. BGP establishes, everything reads healthy, and the BFD session
                    never leaves Down - so the failure detector the operator just enabled is not
                    running. Use `fe80::1%eth0`, or `neighborInterface`, which resolves the zone
                    itself.
                  properties:
                    afiSafis:
                      items:
                        properties:
                          addPaths:
                            properties:
                              receive:
                                type: boolean
                              sendMax:
                                format: int32
                                type: integer
                            type: object
                          enabled:
                            type: boolean
                          family:
                            description: |-
                              Family is the address family, e.g. ipv4-unicast.

                              Enforced as an enum because the converter previously recognized only
                              three names and sent AFI_UNSPECIFIED for anything else - so a typo, or a
                              perfectly valid family it did not know, was accepted by the CRD and
                              silently produced a peer with no usable family.
                            enum:
                            - ipv4-unicast
                            - ipv6-unicast
                            - ipv4-labeled
                            - ipv6-labeled
                            - ipv4-vpn
                            - ipv6-vpn
                            - l2vpn-vpls
                            - l2vpn-evpn
                            - ipv4-flowspec
                            - ipv6-flowspec
                            - rtc
                            type: string
                          prefixLimit:
                            properties:
                              maxPrefixes:
                                format: int32
                                type: integer
                              shutdownThresholdPct:
                                format: int32
                                type: integer
                            required:
                            - maxPrefixes
                            type: object
                        required:
                        - enabled
                        - family
                        type: object
                      type: array
                    applyPolicy:
                      properties:
                        exportPolicy:
                          properties:
                            defaultAction:
                              type: string
                            name:
                              type: string
                            policies:
                              items:
                                type: string
                              type: array
                          type: object
                        importPolicy:
                          properties:
                            defaultAction:
                              type: string
                            name:
                              type: string
                            policies:
                              items:
                                type: string
                              type: array
                          type: object
                      type: object
                    bfd:
                      description: |-
                        BFD, if set, overrides whatever the peer group specifies. Omit it to
                        inherit. See the BFD type for why the override is whole-block.
                      properties:
                        desiredMinimumTxInterval:
                          default: 1000000
                          description: |-
                            DesiredMinimumTxInterval is the minimum interval, in MICROSECONDS,
                            between transmitted control packets. 300000 is 300ms; 300 is 300
                            microseconds.
                          format: int32
                          maximum: 30000000
                          minimum: 300000
                          type: integer
                        detectionMultiplier:
                          default: 3
                          description: |-
                            DetectionMultiplier is how many intervals may be missed before the
                            session is declared down. Detection time is
                            requiredMinimumReceive x detectionMultiplier.
                          format: int32
                          maximum: 255
                          minimum: 3
                          type: integer
                        enabled:
                          description: |-
                            Enabled activates BFD for this session.

                            A pointer so that `enabled: false` survives serialization: as a plain
                            bool with omitempty it would be indistinguishable from an absent block,
                            and an absent block means "inherit from the peer group".
                          type: boolean
                        port:
                          default: 3784
                          description: |-
                            Port is the destination UDP port for control packets sent to this peer.

                            The local listener is always 3784 regardless of this value, so setting
                            anything else means transmitting to a port the peer is probably not
                            listening on. RFC 5881 mandates 3784; there is rarely a reason to change
                            it.
                          format: int32
                          maximum: 65535
                          minimum: 1024
                          type: integer
                        requiredMinimumReceive:
                          default: 1000000
                          description: |-
                            RequiredMinimumReceive is the minimum interval, in MICROSECONDS, between
                            received control packets.
                          format: int32
                          maximum: 30000000
                          minimum: 300000
                          type: integer
                      type: object
                    config:
                      description: |-
                        NeighborConfig is a neighbor's own settings.

                        Peer-group inheritance: for a neighbor that names a peerGroup, any field left
                        unset here takes the group's value. That is why an omitted field is sent to
                        gobgpd as absent rather than as a zero - stating a field claims it and stops
                        the group supplying it.

                        Two consequences worth knowing:

                          - A member CAN override a group's value with a zero one. description,
                            authPassword, allowOwnAsn, replacePeerAsn, allowAspathLoopLocal and
                            sendSoftwareVersion carry explicit presence, so `authPassword: ""` opts a
                            member out of its group's TCP-MD5 password and `replacePeerAsn: false`
                            overrides a group that sets it true. Omitting the field inherits; setting
                            it - to anything, including the zero value - claims it.

                          - allowOwnAsn, replacePeerAsn and allowAspathLoopLocal share one presence
                            signal in gobgpd. Stating any one of them claims all three, so the other
                            two fall back to their defaults instead of inheriting from the group.
                            State all three together, or none.

                          - peerAsn is the exception: where a peer group states one, the group's value
                            always wins and a differing value here is discarded. The controller emits a
                            PeerAsnOverridden warning event when that happens.
                      properties:
                        adminDown:
                          type: boolean
                        allowAspathLoopLocal:
                          description: AllowAspathLoopLocal permits a local AS-path loop.
                          type: boolean
                        allowOwnAsn:
                          description: |-
                            AllowOwnAsn permits our own ASN to appear this many times in a received
                            AS path.

                            The bound is load-bearing, not cosmetic. gobgpd's peer-group path errors
                            above MaxUint8, but its neighbor path does a bare uint8() cast with no
                            check (grpc_server.go, newNeighborFromAPIStruct), so 256 would silently
                            truncate to 0 - the opposite of what was asked for.
                          format: int32
                          maximum: 255
                          type: integer
                        authPassword:
                          description: 'AuthPassword is the BGP authentication password (DEPRECATED: use AuthPasswordSecretRef instead)'
                          type: string
                        authPasswordSecretRef:
                          description: |-
                            AuthPasswordSecretRef references a Secret containing the BGP authentication password
                            The Secret must contain a key matching the neighbor address or a default key "password"
                          properties:
                            key:
                              description: The key of the secret to select from.  Must be a valid secret key.
                              type: string
                            name:
                              default: ""
                              description: |-
                                Name of the referent.
                                This field is effectively required, but due to backwards compatibility is
                                allowed to be empty. Instances of this type with an empty value here are
                                almost certainly wrong.
                                More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                              type: string
                            optional:
                              description: Specify whether the Secret or its key must be defined
                              type: boolean
                          required:
                          - key
                          type: object
                          x-kubernetes-map-type: atomic
                        description:
                          type: string
                        localAsn:
                          format: int32
                          type: integer
                        neighborAddress:
                          description: |-
                            NeighborAddress is the peer's IP address. For a link-local IPv6 peer,
                            include the scope zone: fe80::1%eth0.

                            The length bound is not cosmetic. CEL rules are costed statically against
                            the declared maxLength, so an unbounded string here makes the BFD
                            link-local rule on Neighbor exceed the apiserver's per-rule cost budget
                            by ~64x and the CRD is rejected outright. 64 = 45 (the longest textual
                            IPv6 form, ::ffff:255.255.255.255) + '%' + 15 (IFNAMSIZ-1), rounded up.
                          maxLength: 64
                          type: string
                        neighborInterface:
                          type: string
                        peerAsn:
                          format: int32
                          type: integer
                        peerGroup:
                          type: string
                        removePrivate:
                          description: |-
                            RemovePrivate strips private ASNs from advertised AS paths:
                            "all" removes them, "replace" substitutes our own ASN.
                          enum:
                          - all
                          - replace
                          type: string
                        replacePeerAsn:
                          description: ReplacePeerAsn rewrites the peer's ASN with ours in advertised AS paths.
                          type: boolean
                        routeFlapDamping:
                          description: |-
                            RouteFlapDamping enables RFC 2439 damping for this peer.
                            INERT as of gobgp-netlink v1.3.5, which removed the field from its API
                            because nothing in the daemon implemented it. Accepted here so existing
                            manifests keep applying; setting it has no effect and logs a warning event.
                          type: boolean
                        sendCommunity:
                          description: |-
                            SendCommunity filters which community attributes are advertised to this
                            peer, applied AFTER the export policy - so a policy that adds a community
                            cannot walk past it.

                            Dead in every gobgp release before gobgp-netlink v1.3.1: accepted by the
                            config loader, dropped by the gRPC converters, read by nothing. Omit it to
                            leave gobgpd's behavior alone.

                            "none" is not literal. Large communities, LLGR_STALE/NO_LLGR, and every
                            family except IPv4/IPv6 unicast and labeled unicast survive every
                            setting, and it is ignored entirely for route-server clients. See the BGP
                            section of README.md.

                            Note "none" and "extended" strip NO_EXPORT, NO_ADVERTISE and
                            NO_EXPORT_SUBCONFED, so the receiving AS loses the signal not to
                            re-export. That is a route-leak vector, not just a filter.
                          enum:
                          - standard
                          - extended
                          - both
                          - none
                          type: string
                        sendSoftwareVersion:
                          description: SendSoftwareVersion advertises the software-version capability (RFC 9384).
                          type: boolean
                        vrf:
                          type: string
                      required:
                      - peerAsn
                      type: object
                    ebgpMultihop:
                      properties:
                        enabled:
                          type: boolean
                        multihopTtl:
                          format: int32
                          type: integer
                      required:
                      - enabled
                      type: object
                    gracefulRestart:
                      properties:
                        enabled:
                          type: boolean
                        helperOnly:
                          type: boolean
                        restartTime:
                          description: |-
                            RestartTime is how long a peer should hold this speaker's routes while it
                            restarts, in seconds. Omit it to take gobgpd's default, which is the
                            session's hold time.

                            Bounded at 4095 because RFC 4724 section 3 gives Restart Time 12 bits,
                            sharing a 16-bit word with a 4-bit flags nibble. A larger value does not
                            fail - it silently overflows into the flags and corrupts the capability, so
                            this is not a Go type limit and 65535 would be the wrong bound.
                          format: int32
                          maximum: 4095
                          type: integer
                        staleRoutesTime:
                          description: |-
                            StaleRoutesTime is how long this speaker keeps a restarting peer's routes
                            marked stale before purging them, in seconds. 0 disables the timer, which is
                            gobgpd's default.

                            Only families that have not sent End-of-RIB are purged when it fires, so a
                            family that finished its refresh keeps its adj-RIB-in - checked in
                            staleRoutesExpiredFunc.
                          format: int32
                          type: integer
                      type: object
                    nodeSelector:
                      description: |-
                        A label selector is a label query over a set of resources. The result of matchLabels and
                        matchExpressions are ANDed. An empty label selector matches all objects. A null
                        label selector matches no objects.
                      properties:
                        matchExpressions:
                          description: matchExpressions is a list of label selector requirements. The requirements are ANDed.
                          items:
                            description: |-
                              A label selector requirement is a selector that contains values, a key, and an operator that
                              relates the key and values.
                            properties:
                              key:
                                description: key is the label key that the selector applies to.
                                type: string
                              operator:
                                description: |-
                                  operator represents a key's relationship to a set of values.
                                  Valid operators are In, NotIn, Exists and DoesNotExist.
                                type: string
                              values:
                                description: |-
                                  values is an array of string values. If the operator is In or NotIn,
                                  the values array must be non-empty. If the operator is Exists or DoesNotExist,
                                  the values array must be empty. This array is replaced during a strategic
                                  merge patch.
                                items:
                                  type: string
                                type: array
                                x-kubernetes-list-type: atomic
                            required:
                            - key
                            - operator
                            type: object
                          type: array
                          x-kubernetes-list-type: atomic
                        matchLabels:
                          additionalProperties:
                            type: string
                          description: |-
                            matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                            map is equivalent to an element of matchExpressions, whose key field is "key", the
                            operator is "In", and the values array contains only "value". The requirements are ANDed.
                          type: object
                      type: object
                      x-kubernetes-map-type: atomic
                    routeReflector:
                      properties:
                        routeReflectorClient:
                          type: boolean
                        routeReflectorClusterId:
                          type: string
                      required:
                      - routeReflectorClient
                      - routeReflectorClusterId
                      type: object
                    timers:
                      description: |-
                        Timers holds session timers.

                        Whole-block inheritance: for a neighbor in a peer group, supplying this block
                        at all claims every timer in it. A neighbor that sets only connectRetry
                        therefore stops inheriting the group's holdTime and keepaliveInterval and falls
                        back to gobgpd's defaults. Repeat the group's values here, or omit the block.

                        Editing holdTime or keepaliveInterval rebuilds the BGP session as of
                        gobgp-netlink v1.3.5; connectRetry and idleHoldTimeAfterReset do not. Editing
                        them on a peer group rebuilds every member's session at once, so enable
                        graceful restart first.
                      properties:
                        config:
                          properties:
                            connectRetry:
                              format: int64
                              type: integer
                            holdTime:
                              format: int64
                              type: integer
                            keepaliveInterval:
                              format: int64
                              type: integer
                            minimumAdvertisementInterval:
                              description: |-
                                INERT as of gobgp-netlink v1.3.5, which removed the field from its API
                                because nothing in the daemon implemented it. Accepted here so existing
                                manifests keep applying; setting it has no effect and logs a warning event.
                              format: int64
                              type: integer
                          type: object
                      required:
                      - config
                      type: object
                    transport:
                      properties:
                        bindInterface:
                          type: string
                        ipTos:
                          description: |-
                            IpTos sets IP_TOS / IPV6_TCLASS on the BGP session.

                            Bounded at 255 because it is a single IP header byte and gobgpd casts it
                            to uint8 with no range check - an unbounded value would be silently
                            truncated rather than rejected.
                          format: int32
                          maximum: 255
                          type: integer
                        localAddress:
                          type: string
                        passiveMode:
                          type: boolean
                      type: object
                  required:
                  - config
                  type: object
                  x-kubernetes-validations:
                  - message: a link-local neighborAddress needs its scope zone when BFD is enabled (fe80::1%eth0, not fe80::1); or use neighborInterface instead
                    rule: '!has(self.bfd) || (has(self.bfd.enabled) && !self.bfd.enabled) || !has(self.config.neighborAddress) || !self.config.neighborAddress.lowerAscii().startsWith(''fe80'') || self.config.neighborAddress.contains(''%'')'
                maxItems: 1024
                type: array
              netlinkExport:
                description: NetlinkExport configures global netlink export for exporting BGP routes to Linux kernel
                properties:
                  dampeningInterval:
                    description: 'DampeningInterval in milliseconds to prevent flapping (default: 100)'
                    format: int32
                    type: integer
