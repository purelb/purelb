apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app: purelb
  name: purelb:egress:allocator
rules:
- apiGroups:
  - purelb.io
  resources:
  - clusteregresses
  - egresses
  verbs:
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - purelb.io
  resources:
  - clusteregresses/finalizers
  - egresses/finalizers
  verbs:
  - update
- apiGroups:
  - purelb.io
  resources:
  - clusteregresses/status
  - egressendpoints/status
  - egresses/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - purelb.io
  resources:
  - egressendpoints
  - egressmembers
  - egressnodestates
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  labels:
    app: purelb
  name: purelb:egress:allocator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: purelb:egress:allocator
subjects:
- kind: ServiceAccount
  name: allocator
  namespace: purelb-system
