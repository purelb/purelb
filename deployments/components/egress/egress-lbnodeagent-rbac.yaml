apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app: purelb
  name: purelb:egress:lbnodeagent
rules:
- apiGroups:
  - purelb.io
  resources:
  - clusteregresses
  - egressaddresses
  - egressendpoints
  - egresses
  - egressnodestates
  verbs:
  - get
  - list
  - watch
# The pod-node stage: the agent watches only its own node's pods (field
# selector spec.nodeName) and namespace labels (ClusterEgress selectors).
- apiGroups:
  - ''
  resources:
  - namespaces
  - pods
  verbs:
  - list
  - watch
# The cluster networks pl_pod_tag lets a held pod reach include the
# Service CIDRs.
- apiGroups:
  - networking.k8s.io
  resources:
  - servicecidrs
  verbs:
  - list
  - watch
- apiGroups:
  - purelb.io
  resources:
  - egressnodestates
  verbs:
  - create
- apiGroups:
  - purelb.io
  resources:
  - egressnodestates/status
  verbs:
  - get
  - patch
  - update
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  labels:
    app: purelb
  name: purelb:egress:lbnodeagent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: purelb:egress:lbnodeagent
subjects:
- kind: ServiceAccount
  name: lbnodeagent
  namespace: purelb-system
