# Tier 2 egress test clusters. Run from this directory:
#   ansible-playbook site.yml [--limit t2_calico]
[defaults]
inventory = inventory/proxmox.py
remote_user = adamd
host_key_checking = True
interpreter_python = /usr/bin/python3
stdout_callback = default
forks = 12
retry_files_enabled = False

[ssh_connection]
ssh_args = -o StrictHostKeyChecking=accept-new -o ControlMaster=auto -o ControlPersist=60s
pipelining = True
