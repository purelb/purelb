builds:

- id: allocator
  dir: ./cmd/allocator
  ldflags: &build-meta
  - -X purelb.io/internal/logging.commit={{.Git.ShortCommit}}
  - -X purelb.io/internal/logging.branch={{.Git.Branch}}
  - -X purelb.io/internal/logging.release={{.Env.TAG}}

- id: lbnodeagent
  dir: ./cmd/lbnodeagent
  ldflags: *build-meta

defaultPlatforms:
- linux/arm64
- linux/amd64

# Base images are pinned by digest (the multi-arch index), so a rebuild of
# the same commit gets the same base. To move to a newer base:
#   go run github.com/google/go-containerregistry/cmd/crane@v0.20.2 digest gcr.io/distroless/static:nonroot
#   go run github.com/google/go-containerregistry/cmd/crane@v0.20.2 digest gcr.io/distroless/static:latest
# and replace the digests below.
defaultBaseImage: gcr.io/distroless/static:nonroot@sha256:d62067879de890a1def9da0e7766b7d20810a5e5555cef8506b752437d7a3e88

baseImageOverrides:
  purelb.io/cmd/lbnodeagent: gcr.io/distroless/static:latest@sha256:034df5c1737e8241f6ed6423a12e720ee0f6d6f088609ee172f98f6f2166ef5d
