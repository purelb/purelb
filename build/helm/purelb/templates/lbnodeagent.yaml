---
apiVersion: purelb.io/v2
kind: LBNodeAgent
metadata:
  name: default
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "purelb.labels" . | nindent 4 }}
spec:
  local:
    localInterface: {{ .Values.lbnodeagent.localInterface }}
    dummyInterface: {{ .Values.lbnodeagent.dummyInterface }}
    {{- with .Values.lbnodeagent.garpConfig }}
    garpConfig:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- /* Not "with": an empty map is false to it, and addressGuard: {}
           (every default) must enable the guard, as it does in a CR. */}}
    {{- if kindIs "map" .Values.lbnodeagent.addressGuard }}
    addressGuard:
      {{- toYaml .Values.lbnodeagent.addressGuard | nindent 6 }}
    {{- end }}
