---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    {{- include "purelb.labels" . | nindent 4 }}
    app.kubernetes.io/component: allocator
  name: allocator
  namespace: {{ .Release.Namespace }}
spec:
  # The allocator is the cluster-wide owner of IP allocation, so exactly
  # one must run. Recreate rather than the default RollingUpdate: with a
  # single replica maxSurge rounds up to 1, which would briefly run two
  # allocators handing out addresses from the same pools during every
  # upgrade. A short gap in allocation is the safer trade.
  replicas: 1
  strategy:
    type: Recreate
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      {{- include "purelb.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: allocator
  template:
    metadata:
      annotations:
        prometheus.io/port: '7472'
        prometheus.io/scrape: 'true'
      labels:
        {{- include "purelb.labels" . | nindent 8 }}
        app.kubernetes.io/component: allocator
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
      {{- toYaml . | nindent 6 }}
      {{- end }}
      containers:
      - env:
        - name: PURELB_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: DEFAULT_ANNOUNCER
          value: "{{ .Values.defaultAnnouncer }}"
        image: "{{ .Values.image.repository }}/allocator:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        name: allocator
        ports:
        - containerPort: 7472
          name: monitoring
        resources:
          {{- with .Values.allocator.resources }}
          {{- toYaml . | nindent 10 }}
          {{- end }}
        {{- with .Values.allocator.containerSecurityContext }}
        securityContext:
          {{- toYaml . | nindent 10 }}
        {{- end }}
      nodeSelector:
        kubernetes.io/os: linux
      {{- with .Values.allocator.securityContext }}
      securityContext:
      {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: allocator
      terminationGracePeriodSeconds: 0
      {{- if .Values.priorityClassName }}
      priorityClassName: {{ .Values.priorityClassName }}
      {{- end }}
      {{- with .Values.allocator.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
