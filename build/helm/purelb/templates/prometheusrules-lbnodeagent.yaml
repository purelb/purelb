{{- if and (.Capabilities.APIVersions.Has "monitoring.coreos.com/v1") .Values.Prometheus.lbnodeagent.prometheusRules.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  annotations:
  labels:
    {{- include "purelb.labels" . | nindent 4 }}
    {{- if .Values.Prometheus.lbnodeagent.prometheusRules.extraLabels }}
    {{ toYaml .Values.Prometheus.lbnodeagent.prometheusRules.extraLabels | nindent 4 }}
    {{- end }}
  name: {{ .Release.Name }}-lbnodeagent
  {{- if .Values.Prometheus.lbnodeagent.prometheusRules.namespace }}
  namespace: {{ .Values.Prometheus.lbnodeagent.prometheusRules.namespace }}
  {{- else }}
  namespace: {{ .Release.Namespace }}
  {{- end }}
spec:
  {{- $rules := .Values.Prometheus.lbnodeagent.prometheusRules.rules }}
  {{- $guard := .Values.Prometheus.lbnodeagent.prometheusRules.addressGuardAlerts }}
  {{- if or $rules $guard }}
  groups:
    {{- with $rules }}
    - name: purelb
      rules: {{- tpl (toYaml .) $ | nindent 8 }}
    {{- end }}
    {{- if $guard }}
    - name: purelb-address-guard
      rules:
        - alert: PurelbAddressGuardUnguardedVIPs
          expr: purelb_address_guard_unguarded_vips > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: PureLB address guard is not filtering VIPs on {{`{{ $labels.instance }}`}}
            description: >-
              {{`{{ $value }}`}} VIP(s) on {{`{{ $labels.instance }}`}} are not filtered
              ({{`{{ $labels.reason }}`}}), so host services are reachable on them.
              not_loaded: the guard is configured but its program isn't running
              (kernel older than 6.6, or the BPF capability is missing);
              map_write_failed: a VIP's rules could not be written;
              restart_pending: the guard was enabled after lbnodeagent started
              and takes effect when lbnodeagent is restarted.
        - alert: PurelbAddressGuardStandingDown
          expr: purelb_address_guard_standing_down == 1
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: PureLB node {{`{{ $labels.instance }}`}} announces no addresses
            description: >-
              The address guard on {{`{{ $labels.instance }}`}} is configured with
              failurePolicy closed and isn't working, so the node has stood down:
              other nodes carry its addresses. If every node stands down, the
              addresses are unreachable. The node's Warning Events and
              guardStandingDown log say why.
        - alert: PurelbAddressGuardAttachErrors
          expr: increase(purelb_address_guard_attach_errors_total[10m]) > 0
          labels:
            severity: warning
          annotations:
            summary: PureLB address guard could not attach on {{`{{ $labels.instance }}`}}
            description: >-
              The address guard could not attach to {{`{{ $labels.interface }}`}} on
              {{`{{ $labels.instance }}`}}; VIP traffic arriving on that interface is not filtered.
        - alert: PurelbAddressGuardRestartRequired
          expr: purelb_address_guard_restart_required == 1
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: PureLB address guard change on {{`{{ $labels.instance }}`}} needs an lbnodeagent restart
            description: >-
              The address guard was enabled or disabled after lbnodeagent started
              on {{`{{ $labels.instance }}`}}. The guard program is loaded only at startup: an
              enabled guard filters nothing, and a disabled one stays loaded,
              until lbnodeagent is restarted (kubectl -n purelb-system rollout
              restart daemonset/lbnodeagent).
    {{- end }}
  {{- end }}

{{- end }}
