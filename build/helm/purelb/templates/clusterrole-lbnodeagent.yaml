---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    {{- include "purelb.labels" . | nindent 4 }}
  name: purelb:lbnodeagent
rules:
- apiGroups:
  - purelb.io
  resources:
  - servicegroups
  - lbnodeagents
  verbs:
  - get
  - list
  - watch
  - update
- apiGroups:
  - ''
  resources:
  - nodes
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - discovery.k8s.io
  resources:
  - endpointslices
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ''
  resources:
  - services
  verbs:
  - get
  - list
  - watch
  - update
- apiGroups:
  - ''
  resources:
  - events
  verbs:
  - create
  - patch
# Leases are used for leader election (subnet-aware election via K8s leases)
- apiGroups:
  - coordination.k8s.io
  resources:
  - leases
  verbs:
  - create
  - get
  - list
  - watch
  - update
  - delete
# Read only PureLB's own CRDs, to compare their release stamp with this
# binary's (purelb_crd_stale).
- apiGroups:
  - apiextensions.k8s.io
  resources:
  - customresourcedefinitions
  resourceNames:
  - servicegroups.purelb.io
  - lbnodeagents.purelb.io
  - egresses.purelb.io
  - clusteregresses.purelb.io
  - egressendpoints.purelb.io
  - egressaddresses.purelb.io
  - egressmembers.purelb.io
  - egressnodestates.purelb.io
  verbs:
  - get
