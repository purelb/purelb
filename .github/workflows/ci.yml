name: CI

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
    # feat/egress is the egress integration branch; its phase PRs need the
    # same checks as PRs into main.
    branches: [main, feat/egress]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  KO_DOCKER_REPO: ghcr.io/purelb/purelb
  REGISTRY_IMAGE: ghcr.io/purelb/purelb
  NETBOX_USER_TOKEN: no-op

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: make check

  # Fail a PR whose CRDs changed incompatibly with its base: a field,
  # version or CRD removed, a field newly required, an enum narrowed, a
  # limit tightened (hack/crd-compat.py). Label the PR crd-breaking-ok for
  # an intended break. On a release tag it compares with the previous
  # release, for the release notes, and never fails.
  crd-compat:
    if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Check CRDs for breaking changes
        continue-on-error: ${{ startsWith(github.ref, 'refs/tags/') || contains(github.event.pull_request.labels.*.name, 'crd-breaking-ok') }}
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            base=$(git merge-base HEAD "origin/${BASE_REF}")
          else
            base=$(git describe --tags --abbrev=0 --match 'v*' HEAD^)
          fi
          make check-crd-compat BASE="$base"

  # The address guard's eBPF object is generated and committed. Rebuild it
  # in the same pinned image (hack/bpf-builder) and fail on any byte
  # difference, so the committed binary always matches its source.
  bpf-generate:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Download modules
        run: go mod download

      - name: Regenerate the eBPF objects
        run: make bpf

      - name: Fail if they differ from the committed objects
        run: git diff --exit-code -- internal/addrguard/ internal/egress/datapath/

  # Load the address guard into the runner's kernel and run crafted packets
  # through it, with exactly the lbnodeagent container's BPF-relevant
  # capabilities (CAP_BPF + CAP_NET_ADMIN, no CAP_PERFMON) so the verifier
  # applies the same rules it will in the pod. ADDRGUARD_BPF_TESTS=required
  # turns a skip into a failure: this job can't pass without running them.
  bpf-test:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # pkg/generated is not checked in, and internal/addrguard imports
      # internal/k8s, which needs it.
      - name: Generate Kubernetes client code
        run: make generate

      - name: Build the test binaries
        run: |
          go test -c -o addrguard.test ./internal/addrguard/
          go test -c -o bpfpin.test ./internal/bpfpin/
          go test -c -o datapath.test ./internal/egress/datapath/
          go test -c -o agent.test ./internal/egress/agent/
          go test -c -o local.test ./internal/local/

      # The verifier's behaviour depends on the kernel: record which one ran.
      - name: Run the BPF tests with the agent's capabilities
        run: |
          uname -r
          sudo env ADDRGUARD_BPF_TESTS=required \
            setpriv --inh-caps=-all --bounding-set=-all,+bpf,+net_admin -- \
            ./addrguard.test -test.v -test.skip '^TestAttacher'
          sudo env EGRESS_BPF_TESTS=required \
            setpriv --inh-caps=-all --bounding-set=-all,+bpf,+net_admin -- \
            ./datapath.test -test.v -test.skip '^TestNetns'

      # Attaching to real links, in a throwaway network namespace so the
      # runner's own interfaces are untouched. Creating the namespace needs
      # CAP_SYS_ADMIN on top of the agent's capabilities, and sending the
      # test's frames (an AF_PACKET socket) CAP_NET_RAW. CAP_SYS_ADMIN counts
      # as CAP_PERFMON to the verifier: loading exactly as the agent does is
      # the step above's.
      - name: Run the attacher tests in a network namespace
        run: |
          set -o pipefail
          sudo env ADDRGUARD_BPF_TESTS=required ADDRGUARD_NETNS_TESTS=required \
            setpriv --inh-caps=-all --bounding-set=-all,+bpf,+net_admin,+sys_admin,+net_raw -- \
            ./addrguard.test -test.v -test.run '^TestAttacher' | tee netns.out
          # A renamed test would otherwise pass as "no tests to run".
          grep -q -- '--- PASS: TestAttacherInNetns' netns.out
          grep -q -- '--- PASS: TestAttacherPinsInNetns' netns.out

      # Pinning (D12): links that outlive the agent, taken over by the next.
      # Needs a bpffs, and CAP_SYS_ADMIN for the network namespace.
      - name: Run the pinning tests in a network namespace
        run: |
          set -o pipefail
          sudo env PURELB_NETNS_TESTS=required \
            setpriv --inh-caps=-all --bounding-set=-all,+bpf,+net_admin,+sys_admin -- \
            ./bpfpin.test -test.v | tee bpfpin.out
          grep -q -- '--- PASS: TestPinAdoptRelease' bpfpin.out

      # Egress's tunnel, end to end, between network namespaces: steering,
      # transit, replies through the tunnel (D3).
      - name: Run the egress tunnel tests in network namespaces
        run: |
          set -o pipefail
          sudo modprobe geneve
          sudo modprobe nft_ct
          sudo env EGRESS_BPF_TESTS=required PURELB_NETNS_TESTS=required \
            setpriv --inh-caps=-all --bounding-set=-all,+bpf,+net_admin,+sys_admin,+net_raw -- \
            ./datapath.test -test.v -test.run '^TestNetns' | tee tunnel.out
          grep -q -- '--- PASS: TestNetnsTunnelEndToEnd' tunnel.out
          grep -q -- '--- PASS: TestNetnsHardening' tunnel.out
          grep -q -- '--- PASS: TestNetnsPoolTables' tunnel.out
          grep -q -- '--- PASS: TestNetnsPodDevices' tunnel.out

      # The agent's own datapath apply, run without CAP_SYS_ADMIN as the
      # agent runs it: first apply, repeat, node changes, the tunnel deleted
      # under it, and a restart that takes over its pins.
      - name: Run the egress agent's datapath apply in a network namespace
        run: |
          set -o pipefail
          sudo env PURELB_NETNS_TESTS=required \
            setpriv --inh-caps=-all --bounding-set=-all,+bpf,+net_admin,+sys_admin -- \
            ./agent.test -test.v -test.run '^TestNetns' | tee agent.out
          grep -q -- '--- PASS: TestNetnsApplyDatapath' agent.out
          grep -q -- '--- PASS: TestNetnsApplyDatapathPools' agent.out
          grep -q -- '--- PASS: TestNetnsWatchRoutes' agent.out
          grep -q -- '--- PASS: TestNetnsWatchTunnel' agent.out
          grep -q -- '--- PASS: TestNetnsWatchNft' agent.out
          grep -q -- '--- PASS: TestNetnsApplyDatapathHeals' agent.out
          grep -q -- '--- PASS: TestNetnsApplyDatapathAddresses' agent.out
          grep -q -- '--- PASS: TestNetnsApplyDatapathUplinks' agent.out
          grep -q -- '--- PASS: TestNetnsApplyDatapathPods' agent.out

      # Egress's addresses placed through the announcer's VIP path (D31).
      - name: Run the egress address placement test in a network namespace
        run: |
          set -o pipefail
          sudo env PURELB_NETNS_TESTS=required \
            setpriv --inh-caps=-all --bounding-set=-all,+net_admin,+sys_admin -- \
            ./local.test -test.v -test.run '^TestNetns' | tee local.out
          grep -q -- '--- PASS: TestNetnsPlaceEgress' local.out

  # The same tests on a matrix of distribution kernels, each in a QEMU VM:
  # the verifier differs between kernels, and the runner's tests one.
  bpf-vm-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 cpio

      # The kernel packages are pinned in kernels.sh.
      - name: Cache kernels
        uses: actions/cache@v6
        with:
          path: ~/.cache/purelb-bpf-vm
          key: bpf-vm-${{ hashFiles('hack/bpf-vm/kernels.sh') }}

      - name: Generate Kubernetes client code
        run: make generate

      - name: Run the BPF tests on each kernel
        run: hack/bpf-vm/test.sh

  build-images:
    runs-on: ubuntu-latest
    needs: [test, bpf-generate, bpf-test, bpf-vm-test]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      # Keyless cosign signing and build-provenance attestations use the
      # job's OIDC token.
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Setup ko
        uses: ko-build/setup-ko@v0.10

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Kubernetes client code
        run: make generate

      - name: Setup cosign
        uses: sigstore/cosign-installer@v3

      - name: Build and push allocator
        id: allocator
        env:
          TAG: ${{ github.ref_name }}
        # ko prints the pushed image as repo:tag@<multi-arch index digest>.
        run: |
          ref=$(ko build --base-import-paths --tags="$TAG" ./cmd/allocator)
          echo "digest=${ref#*@}" >> "$GITHUB_OUTPUT"

      - name: Build and push lbnodeagent
        id: lbnodeagent
        env:
          TAG: ${{ github.ref_name }}
        # ko prints the pushed image as repo:tag@<multi-arch index digest>.
        run: |
          ref=$(ko build --base-import-paths --tags="$TAG" ./cmd/lbnodeagent)
          echo "digest=${ref#*@}" >> "$GITHUB_OUTPUT"

      # Keyless: the signature binds the image digest to this workflow run's
      # identity, recorded in the public Rekor log. Verify with
      #   cosign verify --certificate-identity-regexp 'https://github.com/purelb/purelb/' \
      #     --certificate-oidc-issuer https://token.actions.githubusercontent.com <image>
      - name: Sign images
        env:
          ALLOCATOR: ${{ env.KO_DOCKER_REPO }}/allocator@${{ steps.allocator.outputs.digest }}
          LBNODEAGENT: ${{ env.KO_DOCKER_REPO }}/lbnodeagent@${{ steps.lbnodeagent.outputs.digest }}
        run: cosign sign --yes "$ALLOCATOR" "$LBNODEAGENT"

      - name: Attest allocator provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.KO_DOCKER_REPO }}/allocator
          subject-digest: ${{ steps.allocator.outputs.digest }}
          push-to-registry: true

      - name: Attest lbnodeagent provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.KO_DOCKER_REPO }}/lbnodeagent
          subject-digest: ${{ steps.lbnodeagent.outputs.digest }}
          push-to-registry: true

  build-plugin:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            suffix: ""
          - goos: linux
            goarch: arm64
            suffix: ""
          - goos: darwin
            goarch: amd64
            suffix: ""
          - goos: darwin
            goarch: arm64
            suffix: ""
          - goos: windows
            goarch: amd64
            suffix: ".exe"
          - goos: windows
            goarch: arm64
            suffix: ".exe"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build plugin
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          BINARY=kubectl-purelb-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.suffix }}
          go build -ldflags "-X main.version=${{ github.ref_name }} -X main.commit=${{ github.sha }}" \
            -o ${BINARY} ./cmd/kubectl-purelb
          chmod +x ${BINARY}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: kubectl-purelb-${{ matrix.goos }}-${{ matrix.goarch }}
          path: kubectl-purelb-*
          retention-days: 1

  build-manifests:
    runs-on: ubuntu-latest
    needs: [build-images, build-plugin]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    timeout-minutes: 10
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Generate CRDs
        env:
          SUFFIX: ${{ github.ref_name }}
        run: make crd

      - name: Generate manifests
        env:
          SUFFIX: ${{ github.ref_name }}
          MANIFEST_SUFFIX: ${{ github.ref_name }}
        run: make manifest

      - name: Generate install manifest
        env:
          SUFFIX: ${{ github.ref_name }}
          MANIFEST_SUFFIX: ${{ github.ref_name }}
        run: make install-manifest

      - name: Generate install manifest (without egress)
        env:
          SUFFIX: ${{ github.ref_name }}
          MANIFEST_SUFFIX: ${{ github.ref_name }}
        run: make install-manifest-noegress

      - name: Generate manifests (without BGP)
        env:
          SUFFIX: ${{ github.ref_name }}
          MANIFEST_SUFFIX: ${{ github.ref_name }}
        run: make manifest-nobgp

      - name: Generate install manifest (without BGP)
        env:
          SUFFIX: ${{ github.ref_name }}
          MANIFEST_SUFFIX: ${{ github.ref_name }}
        run: make install-manifest-nobgp

      - name: Generate CRDs-only install manifest
        env:
          SUFFIX: ${{ github.ref_name }}
          MANIFEST_SUFFIX: ${{ github.ref_name }}
        run: make install-crds

      - name: Generate CRDs-only install manifest (without egress)
        env:
          SUFFIX: ${{ github.ref_name }}
          MANIFEST_SUFFIX: ${{ github.ref_name }}
        run: make install-crds-noegress

      - name: Generate CRDs-only install manifest (without BGP)
        env:
          SUFFIX: ${{ github.ref_name }}
          MANIFEST_SUFFIX: ${{ github.ref_name }}
        run: make install-crds-nobgp

      - name: Package Helm chart
        env:
          SUFFIX: ${{ github.ref_name }}
        run: make helm

      - name: Push Helm chart to OCI registry
        run: helm push purelb-${{ github.ref_name }}.tgz oci://ghcr.io/purelb/purelb/charts

      - name: Download plugin binaries
        uses: actions/download-artifact@v8
        with:
          pattern: kubectl-purelb-*
          merge-multiple: true
          path: plugin-binaries/

      - name: Collect plugin binaries
        run: mv plugin-binaries/kubectl-purelb-* .

      - name: Generate checksums
        run: |
          sha256sum purelb-${{ github.ref_name }}.tgz > SHA256SUMS
          sha256sum deployments/purelb-${{ github.ref_name }}.yaml >> SHA256SUMS
          sha256sum deployments/install-${{ github.ref_name }}.yaml >> SHA256SUMS
          sha256sum deployments/install-noegress-${{ github.ref_name }}.yaml >> SHA256SUMS
          sha256sum deployments/purelb-nobgp-${{ github.ref_name }}.yaml >> SHA256SUMS
          sha256sum deployments/install-nobgp-${{ github.ref_name }}.yaml >> SHA256SUMS
          sha256sum deployments/install-crds-${{ github.ref_name }}.yaml >> SHA256SUMS
          sha256sum deployments/install-crds-noegress-${{ github.ref_name }}.yaml >> SHA256SUMS
          sha256sum deployments/install-crds-nobgp-${{ github.ref_name }}.yaml >> SHA256SUMS
          sha256sum kubectl-purelb-* >> SHA256SUMS

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: deployment-manifests-${{ github.sha }}
          path: |
            deployments/*.yaml
            purelb-*.tgz
            kubectl-purelb-*
            SHA256SUMS
          retention-days: 30

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            purelb-${{ github.ref_name }}.tgz
            deployments/purelb-${{ github.ref_name }}.yaml
            deployments/install-${{ github.ref_name }}.yaml
            deployments/install-noegress-${{ github.ref_name }}.yaml
            deployments/purelb-nobgp-${{ github.ref_name }}.yaml
            deployments/install-nobgp-${{ github.ref_name }}.yaml
            deployments/install-crds-${{ github.ref_name }}.yaml
            deployments/install-crds-noegress-${{ github.ref_name }}.yaml
            deployments/install-crds-nobgp-${{ github.ref_name }}.yaml
            kubectl-purelb-linux-amd64
            kubectl-purelb-linux-arm64
            kubectl-purelb-darwin-amd64
            kubectl-purelb-darwin-arm64
            kubectl-purelb-windows-amd64.exe
            kubectl-purelb-windows-arm64.exe
            SHA256SUMS
          generate_release_notes: true
          fail_on_unmatched_files: true

  scan:
    runs-on: ubuntu-latest
    needs: build-images
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    permissions:
      security-events: write
    steps:
      - name: Scan allocator image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/purelb/purelb/allocator:${{ github.ref_name }}
          format: 'sarif'
          output: 'allocator-trivy-results.sarif'

      - name: Scan lbnodeagent image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/purelb/purelb/lbnodeagent:${{ github.ref_name }}
          format: 'sarif'
          output: 'lbnodeagent-trivy-results.sarif'

      - name: Upload allocator scan results
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'allocator-trivy-results.sarif'
          category: 'allocator-container'

      - name: Upload lbnodeagent scan results
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'lbnodeagent-trivy-results.sarif'
          category: 'lbnodeagent-container'
