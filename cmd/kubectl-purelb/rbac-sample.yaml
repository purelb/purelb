# Sample RBAC for kubectl-purelb plugin users.
#
# The ClusterRole is read-only access to the resources the plugin queries.
# No pod exec required for these: all BGP data comes from BGPNodeStatus CRDs.
# egress dump, trace --live and validate --live do need it, and egress cleanup
# and release-finalizers need more: see the roles at the end of this file.
#
# The Role, in the PureLB namespace only, adds get on pods/proxy: the
# address guard's live state (`guard`, and the guard part of `status`) is
# read from each lbnodeagent's metrics through the API server's pod proxy.
# That is more than read-only. pods/proxy lets its holder send an HTTP GET
# to ANY port of any pod in the namespace, and lbnodeagent runs with
# hostNetwork, so its pod IP is the node's IP: any HTTP service on a node's
# address that the API server can reach. Bind it only to users who should
# have that; without it, the plugin reports the live state as unavailable
# and everything else works.
#
# Usage:
#   kubectl apply -f rbac-sample.yaml
#   kubectl create clusterrolebinding purelb-viewer \
#     --clusterrole=purelb:plugin-viewer \
#     --user=<your-user>
#   # optional: the address guard's live state
#   kubectl -n purelb-system create rolebinding purelb-viewer-metrics \
#     --role=purelb:plugin-metrics \
#     --user=<your-user>
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: purelb:plugin-viewer
  labels:
    app: purelb
rules:
# Core resources
- apiGroups: [""]
  resources:
  - services
  - pods
  - nodes
  - events
  - endpoints
  verbs: [get, list, watch]
- apiGroups: ["discovery.k8s.io"]
  resources:
  - endpointslices
  verbs: [get, list, watch]
# Leases (election state)
- apiGroups: ["coordination.k8s.io"]
  resources:
  - leases
  verbs: [get, list, watch]
# PureLB CRDs
- apiGroups: ["purelb.io"]
  resources:
  - servicegroups
  - lbnodeagents
  verbs: [get, list, watch]
# Address guard checks in `validate`: the lbnodeagent capabilities and
# whether the installed LBNodeAgent CRD knows addressGuard. Without these,
# validate reports "unable to check" instead of failing.
- apiGroups: ["apps"]
  resources:
  - daemonsets
  verbs: [get, list]
- apiGroups: ["apiextensions.k8s.io"]
  resources:
  - customresourcedefinitions
  verbs: [get]
# Egress
- apiGroups: ["purelb.io"]
  resources:
  - egresses
  - clusteregresses
  - egressendpoints
  - egressmembers
  - egressnodestates
  verbs: [get, list, watch]
# BGP CRDs
- apiGroups: ["bgp.purelb.io"]
  resources:
  - configs
  - bgpnodestatuses
  verbs: [get, list, watch]
---
# The address guard's live state: see the header. Namespaced, so it reaches
# only PureLB's own pods.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: purelb:plugin-metrics
  namespace: purelb-system
  labels:
    app: purelb
rules:
- apiGroups: [""]
  resources:
  - pods/proxy
  verbs: [get]
---
# egress dump, trace --live and validate --live run lbnodeagent diag in the
# agents through kubectl exec. Exec into an lbnodeagent runs as it does, with
# its capabilities, so this is far more than read-only: bind it to operators.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: purelb:plugin-egress-live
  namespace: purelb-system
  labels:
    app: purelb
rules:
- apiGroups: [""]
  resources:
  - pods/exec
  verbs: [create]
---
# The break-glass commands: egress cleanup runs a privileged pod on each node,
# release-finalizers removes finalizers. Bind these only when they're needed.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: purelb:plugin-egress-admin
  namespace: purelb-system
  labels:
    app: purelb
rules:
- apiGroups: [""]
  resources:
  - pods
  verbs: [create, delete, get]
- apiGroups: [""]
  resources:
  - pods/log
  verbs: [get]
- apiGroups: ["purelb.io"]
  resources:
  - egressendpoints
  verbs: [get, list, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: purelb:plugin-egress-admin
  labels:
    app: purelb
rules:
- apiGroups: ["purelb.io"]
  resources:
  - egresses
  - clusteregresses
  verbs: [get, list, patch]
