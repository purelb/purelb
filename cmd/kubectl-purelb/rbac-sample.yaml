# Sample ClusterRole for kubectl-purelb plugin users.
# This provides read-only access to all resources the plugin queries.
# No pod exec required — all BGP data comes from BGPNodeStatus CRDs.
#
# Usage:
#   kubectl apply -f rbac-sample.yaml
#   kubectl create clusterrolebinding purelb-viewer \
#     --clusterrole=purelb:plugin-viewer \
#     --user=<your-user>
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: purelb:plugin-viewer
  labels:
    app: purelb
rules:
# Core resources
- apiGroups: [""]
  resources:
  - services
  - pods
  - nodes
  - events
  - endpoints
  verbs: [get, list, watch]
# Address guard live state (`guard`, and the guard part of `status`): read
# each lbnodeagent's metrics through the API server's pod proxy. Without it
# they report the live state as unavailable. pods/proxy reaches any port of
# any pod it covers; to narrow it, bind this rule with a namespaced Role in
# the PureLB namespace instead.
- apiGroups: [""]
  resources:
  - pods/proxy
  verbs: [get]
- apiGroups: ["discovery.k8s.io"]
  resources:
  - endpointslices
  verbs: [get, list, watch]
# Leases (election state)
- apiGroups: ["coordination.k8s.io"]
  resources:
  - leases
  verbs: [get, list, watch]
# PureLB CRDs
- apiGroups: ["purelb.io"]
  resources:
  - servicegroups
  - lbnodeagents
  verbs: [get, list, watch]
# Address guard checks in `validate`: the lbnodeagent capabilities and
# whether the installed LBNodeAgent CRD knows addressGuard. Without these,
# validate reports "unable to check" instead of failing.
- apiGroups: ["apps"]
  resources:
  - daemonsets
  verbs: [get, list]
- apiGroups: ["apiextensions.k8s.io"]
  resources:
  - customresourcedefinitions
  verbs: [get]
# BGP CRDs
- apiGroups: ["bgp.purelb.io"]
  resources:
  - configs
  - bgpnodestatuses
  verbs: [get, list, watch]
