    "VIP announced on * nodes": "tests/test_router_bgp.py::test_the_router_learns_a_host_route_via_every_node"
    "Route to * found in FRR RIB": "tests/test_router_bgp.py::test_the_router_learns_a_host_route_via_every_node"
    "Route has valid next-hops": "tests/test_router_bgp.py::test_the_router_learns_a_host_route_via_every_node"
    "Route has correct * aggregation": "tests/test_router_bgp.py::test_the_advertised_prefix_length_matches_the_aggregation"
    "*aggregation correct*": "tests/test_router_bgp.py::test_the_advertised_prefix_length_matches_the_aggregation"
    "*aggregation verified*": "tests/test_router_bgp.py::test_the_advertised_prefix_length_matches_the_aggregation"
    "*Aggregation*": "tests/test_router_bgp.py::test_the_advertised_prefix_length_matches_the_aggregation"
