    "*node failure*": "tests/test_router_bgp.py::test_losing_a_node_drops_only_its_next_hop"
    "Node failure*": "tests/test_router_bgp.py::test_losing_a_node_drops_only_its_next_hop"

    # ETP Local
    "*: VIP present (endpoint*": "tests/test_router_bgp.py::test_etp_local_narrows_the_next_hops_to_endpoint_nodes"
    "*: IPv6 VIP present (endpoint*": "tests/test_router_bgp.py::test_etp_local_narrows_the_next_hops_to_endpoint_nodes"
