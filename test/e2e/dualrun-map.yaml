    "IPv6 correctly placed on kube-lb0 on all nodes": "tests/test_remote.py::test_ipv6_only_remote_allocation"
    "Both IPv4 and IPv6 allocated": "tests/test_remote.py::test_dual_stack_remote_allocation"
