    "Default aggregation IP on all nodes": "tests/test_remote.py::test_aggregation_sets_the_configured_prefix_on_every_node"
    "Default aggregation IPv6 on all nodes": "tests/test_remote.py::test_aggregation_sets_the_configured_prefix_on_every_node"

