# bash assertion -> pytest test, for scripts/e2e-dualrun.sh
#
# Every `pass "…"` message a bash suite prints must match exactly one
# pattern here, and each pattern names the pytest test(s) that replace it.
# An unmapped assertion makes the dual-run fail, which is what stops a test
# being dropped silently during the port: deleting bash code alone can
# never make the run clean.
#
# Format:
#
#   suite-name:
#     script: test/e2e/<dir>/<script>.sh      # repo-relative
#     assertions:
#       "<glob matching the pass message>": tests/test_x.py::test_y
#       "<glob>":
#         - tests/test_x.py::test_a
#         - tests/test_x.py::test_b
#
# Patterns are globs (fnmatch), not literals, because bash assertion
# messages interpolate the values they just observed -- "service allocated
# 172.30.250.201". Matching the literal would tie the mapping to whichever
# addresses the pool happened to hand out.
#
# Order matters: the first matching pattern wins, so put specific patterns
# above the general ones that would also match them. YAML preserves
# mapping order, and the loader relies on it.
#
# Quote every pattern. An unquoted key containing `:` or starting with `*`
# is a YAML syntax error or, worse, parses as something else -- and
# assertion messages contain both.
#
# A suite gets its entry in the same commit that ports it, and both the
# entry and the bash script are deleted in the commit that retires the
# suite -- so this file is empty exactly when the migration is finished.
#
# Take the patterns from a REAL run's output, not by reading the script.
# Assertions interpolate the values they observed, and some never print at
# all in a passing run -- ipam-external had two such -- which reading alone
# does not reveal.

