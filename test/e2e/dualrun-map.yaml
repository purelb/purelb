    "Test pods running*": "tests/test_harness.py::test_connects_and_sees_nodes"

# The non-FRR router suite is the FRR one minus the RIB assertions -- its
# own header says so, and comparing a reference run of each confirmed it:
# every assertion it makes is a re-wording of one the FRR suite makes.
# It gets its own entry rather than being assumed covered, because "this
# script is a subset of that one" is exactly the sort of claim that has
# been wrong four times in this migration.
router:
  script: test/e2e/router/test-router-connectivity.sh
  assertions:
    "*SSH*": "tests/test_harness.py::test_connects_and_sees_nodes"
    "Router * reachable*": "tests/test_harness.py::test_router_reachable_and_faces_the_pool_subnet"
